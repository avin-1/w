<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; }
    nav { background: #1e293b; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: white; text-decoration: none; font-size: 14px; margin-left: 10px; padding: 6px 12px; border: 1px solid #fff; border-radius: 4px; }
    nav .brand { font-size: 18px; font-weight: bold; border: none; padding: 0; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    h3 { margin-bottom: 16px; color: #333; }
    .filter-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .filter-row input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .filter-row button { padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .filter-row a { padding: 8px 16px; background: #e2e8f0; color: #333; border-radius: 4px; text-decoration: none; font-size: 14px; }
    .empty { color: #888; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .book-card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .book-card h5 { margin-bottom: 6px; color: #333; }
    .book-card .author { color: #888; font-size: 13px; margin-bottom: 6px; }
    .badge { display: inline-block; background: #e2e8f0; color: #555; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .price { color: #16a34a; font-weight: bold; margin-top: 8px; }
    .add-btn { width: 100%; margin-top: 10px; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="/">📚 BookStore</a>
  <div><a href="/">Home</a><a href="/login">Login</a></div>
</nav>
<div class="container">
  <h3>📚 Book Catalog</h3>
  <form method="get" class="filter-row">
    <input type="text" name="category" placeholder="Filter by category" th:value="${category}"/>
    <button type="submit">Filter</button>
    <a href="/catalog">Clear</a>
  </form>

  <p class="empty" th:if="${books.isEmpty()}">No books found.</p>

  <div class="grid">
    <div class="book-card" th:each="book : ${books}">
      <h5 th:text="${book.title}">Title</h5>
      <p class="author" th:text="'by ' + ${book.author}">Author</p>
      <span class="badge" th:text="${book.category}">Category</span>
      <p class="price" th:text="'₹ ' + ${book.price}">Price</p>
      <button class="add-btn">Add to Cart</button>
    </div>
  </div>
</div>
</body>
</html>
