<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canvas Drawing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 24px 16px; }
    .container { max-width: 720px; margin: 0 auto; }
    h3 { color: #333; margin-bottom: 6px; }
    p.sub { color: #888; font-size: 14px; margin-bottom: 16px; }

    .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
               background: white; padding: 12px 16px; border-radius: 8px;
               box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .toolbar label { font-size: 13px; font-weight: bold; color: #555; }
    .toolbar select, .toolbar input[type="color"], .toolbar input[type="range"] {
      padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; cursor: pointer;
    }
    .toolbar button { padding: 6px 14px; border: none; border-radius: 4px;
                      cursor: pointer; font-size: 13px; color: white; }
    .btn-clear { background: #ef4444; }
    .btn-save  { background: #22c55e; }

    canvas { display: block; background: white; border-radius: 8px;
             box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: crosshair; width: 100%; }

    .coords { font-size: 12px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
<div class="container">
  <h3>🎨 Canvas Drawing</h3>
  <p class="sub">Click and drag to draw. Use the toolbar to switch shapes and colors.</p>

  <div class="toolbar">
    <label>Shape:
      <select id="shapeSelect">
        <option value="freehand">✏️ Freehand</option>
        <option value="line">📏 Line</option>
        <option value="rect">⬜ Rectangle</option>
        <option value="circle">⭕ Circle</option>
      </select>
    </label>

    <label>Color:
      <input type="color" id="colorPicker" value="#3b82f6"/>
    </label>

    <label>Size:
      <input type="range" id="sizeRange" min="1" max="20" value="3"/>
      <span id="sizeVal">3</span>px
    </label>

    <button class="btn-clear" onclick="clearCanvas()">🗑️ Clear</button>
    <button class="btn-save"  onclick="saveCanvas()">💾 Save</button>
  </div>

  <canvas id="canvas" width="700" height="450"></canvas>
  <p class="coords" id="coords">x: 0, y: 0</p>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');

  let isDrawing = false;
  let startX = 0, startY = 0;
  let snapshot; // for shape preview

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top)  * scaleY
    };
  }

  function getShape() { return document.getElementById('shapeSelect').value; }
  function getColor() { return document.getElementById('colorPicker').value; }
  function getSize()  { return parseInt(document.getElementById('sizeRange').value); }

  // Update size label
  document.getElementById('sizeRange').addEventListener('input', function() {
    document.getElementById('sizeVal').textContent = this.value;
  });

  canvas.addEventListener('mousedown', function(e) {
    isDrawing = true;
    const pos = getPos(e);
    startX = pos.x;
    startY = pos.y;

    ctx.strokeStyle = getColor();
    ctx.lineWidth   = getSize();
    ctx.lineCap     = 'round';

    if (getShape() === 'freehand') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
    } else {
      // Save canvas state for shape preview
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
  });

  canvas.addEventListener('mousemove', function(e) {
    const pos = getPos(e);
    document.getElementById('coords').textContent = `x: ${Math.round(pos.x)}, y: ${Math.round(pos.y)}`;

    if (!isDrawing) return;

    const shape = getShape();

    if (shape === 'freehand') {
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      return;
    }

    // Restore snapshot for clean preview
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = getColor();
    ctx.lineWidth   = getSize();

    const w = pos.x - startX;
    const h = pos.y - startY;

    ctx.beginPath();
    if (shape === 'line') {
      ctx.moveTo(startX, startY);
      ctx.lineTo(pos.x, pos.y);
    } else if (shape === 'rect') {
      ctx.rect(startX, startY, w, h);
    } else if (shape === 'circle') {
      const radius = Math.sqrt(w * w + h * h);
      ctx.arc(startX, startY, radius, 0, Math.PI * 2);
    }
    ctx.stroke();
  });

  canvas.addEventListener('mouseup',    () => { isDrawing = false; });
  canvas.addEventListener('mouseleave', () => { isDrawing = false; });

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function saveCanvas() {
    const link = document.createElement('a');
    link.download = 'drawing.png';
    link.href = canvas.toDataURL();
    link.click();
  }
</script>
</body>
</html>
